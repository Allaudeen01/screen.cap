<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Auto Screenshot Compressor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #333;
    }
    h1 { margin-bottom: 20px; color: #111; }
    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0056b3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 20px; font-size: 18px; font-weight: 500; }
    #timer { font-size: 24px; margin-top: 10px; color: #007bff; }
    #error { color: #c00; margin-top: 12px; max-width: 640px; text-align: center; }
  </style>
</head>
<body>
  <h1>Auto Screenshot Compressor</h1>
  <button id="startBtn">🎥 Start Auto Screenshot</button>
  <button id="stopBtn" disabled>🛑 Stop</button>
  <div id="status">Status: Idle</div>
  <div id="timer">Next capture in: --:--</div>
  <div id="error"></div>

  <!-- image compression library -->
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>

  <script>
    let captureInterval = null;
    let countdownInterval = null;
    let nextCaptureIn = 0;
    let stream = null;

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusEl = document.getElementById("status");
    const timerEl = document.getElementById("timer");
    const errorEl = document.getElementById("error");

    function showError(msg, err) {
      console.error(msg, err);
      errorEl.textContent = msg + (err ? " — " + (err.message || err) : "");
      statusEl.textContent = "Status: Error";
    }

    async function selectWindow() {
      try {
        const s = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: false,
        });
        return s;
      } catch (err) {
        showError("Screen capture permission denied or not available.", err);
        throw err;
      }
    }

    async function captureFrame(s) {
      return new Promise((resolve, reject) => {
        const video = document.createElement("video");
        video.srcObject = s;
        video.muted = true;
        video.playsInline = true;
        video.style.display = "none";
        document.body.appendChild(video);

        const cleanup = () => {
          if (video.parentNode) video.parentNode.removeChild(video);
        };

        video.addEventListener(
          "loadedmetadata",
          async () => {
            try {
              await video.play();
              const canvas = document.createElement("canvas");
              canvas.width = video.videoWidth || 1280;
              canvas.height = video.videoHeight || 720;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              video.pause();
              cleanup();
              canvas.toBlob(
                (blob) => {
                  if (blob) resolve(blob);
                  else reject(new Error("Canvas toBlob returned null"));
                },
                "image/png",
                1.0
              );
            } catch (e) {
              cleanup();
              reject(e);
            }
          },
          { once: true }
        );

        video.addEventListener(
          "error",
          (e) => {
            cleanup();
            reject(e);
          },
          { once: true }
        );
      });
    }

    async function compressImage(blob) {
      try {
        const options = {
          maxSizeMB: 0.1,
          maxWidthOrHeight: 1920,
          useWebWorker: true,
        };
        const compressedBlob = await imageCompression(blob, options);
        return compressedBlob;
      } catch (err) {
        console.warn("Compression failed, returning original image.", err);
        return blob;
      }
    }

    function downloadImage(blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `screenshot_${new Date()
        .toISOString()
        .replace(/[:.]/g, "-")}.jpg`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function takeAndSave() {
      if (!stream) {
        showError("No active screen stream. Click Start to allow screen capture.");
        return;
      }
      try {
        statusEl.textContent = "Status: Capturing...";
        const frame = await captureFrame(stream);

        statusEl.textContent = "Status: Compressing...";
        const finalBlob = await compressImage(frame);

        statusEl.textContent = "Status: Downloading...";
        downloadImage(finalBlob);

        statusEl.textContent = "Status: Running";
        errorEl.textContent = "";
      } catch (err) {
        showError("Capture or compression failed.", err);
      }
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(nextCaptureIn / 60);
      const seconds = nextCaptureIn % 60;
      timerEl.textContent = `Next capture in: ${minutes
        .toString()
        .padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
    }

    async function startAutoScreenshot(intervalMinutes = 15) {
      startBtn.disabled = true;
      stopBtn.disabled = false;
      statusEl.textContent = "Status: Selecting window...";
      try {
        stream = await selectWindow();
      } catch (err) {
        startBtn.disabled = false;
        stopBtn.disabled = true;
        return;
      }

      await takeAndSave();

      nextCaptureIn = intervalMinutes * 60;
      updateTimerDisplay();
      countdownInterval = setInterval(() => {
        nextCaptureIn--;
        if (nextCaptureIn <= 0) nextCaptureIn = intervalMinutes * 60;
        updateTimerDisplay();
      }, 1000);

      captureInterval = setInterval(takeAndSave, intervalMinutes * 60 * 1000);
    }

    function stopAutoScreenshot() {
      startBtn.disabled = false;
      stopBtn.disabled = true;
      clearInterval(captureInterval);
      clearInterval(countdownInterval);
      captureInterval = null;
      countdownInterval = null;
      nextCaptureIn = 0;
      updateTimerDisplay();
      statusEl.textContent = "Status: Stopped";
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
    }

    startBtn.addEventListener("click", () => startAutoScreenshot(15));
    stopBtn.addEventListener("click", stopAutoScreenshot);
    window.addEventListener("beforeunload", stopAutoScreenshot);
  </script>
</body>
</html>
