<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Screenshot & Compressor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #333;
    }
    h1 {
      margin-bottom: 20px;
      color: #111;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s ease;
    }
    button:hover {
      background-color: #0056b3;
    }
    #status {
      margin-top: 20px;
      font-size: 18px;
      font-weight: 500;
    }
    #timer {
      font-size: 24px;
      margin-top: 10px;
      color: #007bff;
    }
  </style>
</head>
<body>
  <h1>Auto Screenshot Compressor</h1>

  <button onclick="startAutoScreenshot()">🎥 Start Auto Screenshot</button>
  <button onclick="stopAutoScreenshot()">🛑 Stop</button>
  <button onclick="takeAndSave()">📸 Take One Screenshot</button>

  <div id="status">Status: Idle</div>
  <div id="timer">Next capture in: --</div>
  <div id="log" style="margin-top:10px; font-size:12px; color:#555; max-width:860px; padding:8px; background:#fff; border:1px solid #ddd; border-radius:6px;">
    Log: ready.
  </div>

  <!-- Load browser-image-compression UMD build (global window.imageCompression) -->
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@1.0.17/dist/browser-image-compression.js"></script>
  <script>
    // Use the global from the UMD build
    const imageCompression = window.imageCompression;

    function log(msg, err) {
      const el = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      el.textContent += `\n[${time}] ${msg}`;
      if (err) {
        el.textContent += `\n  → ${err?.message || err}`;
      }
      el.scrollTop = el.scrollHeight;
      console.log(msg, err || '');
    }

    let captureInterval;
    let countdownInterval;
    let nextCaptureIn = 0;
    let stream;
    let running = false;

    async function selectWindow() {
      try {
        if (!('mediaDevices' in navigator) || !('getDisplayMedia' in navigator.mediaDevices)) {
          throw new Error('getDisplayMedia is not supported in this browser. Try Chrome/Edge.');
        }
        if (!window.isSecureContext) {
          log('Note: Insecure context (file://). getDisplayMedia is usually allowed, but some features may be limited.');
        }
        const s = await navigator.mediaDevices.getDisplayMedia({
          video: { cursor: "never" },
          audio: false,
        });
        return s;
      } catch (err) {
        alert("You must allow screen capture for this to work.");
        log('selectWindow failed. User denied, or not supported.', err);
        throw err;
      }
    }

    // Robust frame capture: wait for a real frame before drawing
    async function captureFrame(s) {
      const video = document.createElement("video");
      video.srcObject = s;
      video.muted = true;
      video.playsInline = true;
      await video.play();

      await new Promise((resolve) => {
        if (typeof video.requestVideoFrameCallback === "function") {
          video.requestVideoFrameCallback(() => resolve());
        } else {
          requestAnimationFrame(() => resolve());
        }
      });

      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      video.pause();
      video.srcObject = null;

      return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(blob), "image/png");
      });
    }

    async function compressImageWithCanvas(blob, quality = 0.7) {
      const img = await createImageBitmap(blob);
      const canvas = document.createElement("canvas");
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      return new Promise((resolve) => {
        canvas.toBlob(
          (compressedBlob) => resolve(compressedBlob),
          "image/jpeg",
          quality
        );
      });
    }

    // compress using the library to target ~100KB with optional downscale
    async function compressWithLibrary(blob) {
      const options = {
        maxSizeMB: 0.1, // target ≈100 KB
        maxWidthOrHeight: 1440,
        useWebWorker: true,
        maxIteration: 10,
      };
      try {
        const compressed = await imageCompression(blob, options);
        return compressed;
      } catch (err) {
        console.warn("Library compression failed, falling back to input blob:", err);
        return blob;
      }
    }

    function downloadImage(blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      // Windows-safe timestamp (avoid colons)
      const ts = new Date();
      const stamp = `${ts.getFullYear()}-${String(ts.getMonth() + 1).padStart(2, "0")}-${String(ts.getDate()).padStart(2, "0")}_${String(ts.getHours()).padStart(2, "0")}-${String(ts.getMinutes()).padStart(2, "0")}-${String(ts.getSeconds()).padStart(2, "0")}`;
      a.href = url;
      a.download = `screenshot_${stamp}.jpg`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      // Revoke after a short delay to avoid races
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    async function takeAndSave() {
      try {
        document.getElementById("status").textContent = "Status: Capturing...";
        log('Capturing frame…');
        const frame = await captureFrame(stream);

        document.getElementById("status").textContent = "Status: Canvas compressing...";
        log('Canvas compressing…');
        const canvasCompressed = await compressImageWithCanvas(frame, 0.7);

        document.getElementById("status").textContent = "Status: Library compressing...";
        log('Library compressing…');
        const finalBlob = await compressWithLibrary(canvasCompressed);

        document.getElementById("status").textContent = "Status: Downloading...";
        log('Triggering download…');
        downloadImage(finalBlob);

        document.getElementById("status").textContent = "Status: Running";
        log('Done.');
      } catch (err) {
        console.error("capture/save failed:", err);
        document.getElementById("status").textContent = "Status: Error";
        log('capture/save failed', err);
      }
    }

    async function startAutoScreenshot(intervalMinutes = 15) {
      if (running) { log('Already running.'); return; }
      document.getElementById("status").textContent = "Status: Selecting window...";
      log('Requesting screen/window selection…');
      try {
        stream = await selectWindow();
      } catch (err) {
        document.getElementById("status").textContent = "Status: Idle";
        return; // user cancelled
      }

      // Stop automatically if user ends sharing from browser UI
      stream.getVideoTracks().forEach((t) => {
        t.onended = () => { log('Screen sharing ended by user. Stopping.'); stopAutoScreenshot(); };
      });

      running = true;
      document.getElementById("status").textContent = "Status: Running";
      log('Running. Taking first screenshot immediately.');

      // Take the first immediately
      await takeAndSave();

      // Start countdown
      nextCaptureIn = intervalMinutes * 60;
      updateTimerDisplay();

      countdownInterval = setInterval(() => {
        nextCaptureIn--;
        if (nextCaptureIn <= 0) nextCaptureIn = intervalMinutes * 60;
        updateTimerDisplay();
      }, 1000);

      // Repeat every interval
      captureInterval = setInterval(takeAndSave, intervalMinutes * 60 * 1000);
    }

    function stopAutoScreenshot() {
      clearInterval(captureInterval);
      clearInterval(countdownInterval);
      running = false;
      document.getElementById("status").textContent = "Status: Stopped";
      document.getElementById("timer").textContent = "Next capture in: --";
      log('Stopped.');
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(nextCaptureIn / 60);
      const seconds = nextCaptureIn % 60;
      document.getElementById("timer").textContent =
        `Next capture in: ${minutes.toString().padStart(2, "0")}:${seconds
          .toString()
          .padStart(2, "0")}`;
    }

    // Expose start/stop to window for button onclick usage
    window.startAutoScreenshot = startAutoScreenshot;
    window.stopAutoScreenshot = stopAutoScreenshot;
  </script>
</body>
</html>
